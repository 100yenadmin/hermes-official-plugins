name: claude-subscription-directsdk-experimental
kind: model-provider
version: 0.4.0+session.20
manifest_version: 2
description: Claude Subscription DirectSDK (Experimental), session-mode fork — drive your Claude Pro/Max subscription through the official Claude Code CLI; Hermes owns tools, approvals and compaction
author: Nous Research
license: MIT
homepage: https://github.com/100yenadmin/hermes-official-plugins/tree/eva/session-main/claude-subscription-directsdk
tags: [model-provider, anthropic, claude, subscription, experimental]
requires_hermes: ">=0.21.4"
platforms: []
optional_env:
  - CLAUDE_SUBSCRIPTION_DIRECTSDK_COMMAND
  - CLAUDE_SUBSCRIPTION_DIRECTSDK_PROXY_AUTH
  - ANTHROPIC_CUSTOM_HEADERS
  - CLAUDE_SUBSCRIPTION_DIRECTSDK_CONFIG_DIR
  - CLAUDE_CONFIG_DIR
external_dependencies:
  - name: claude
    check: "claude --version"
    install: "npm install -g @anthropic-ai/claude-code"
config_schema:
  claude_config_dir:
    type: string
    default: ""
    label: Claude login config directory
    description: Select this profile's logged-in Claude config directory, overriding process environment directories.
  inherit_launch_login:
    type: bool
    default: false
    label: Use the login this Hermes process inherited
    description: For the profile whose Claude login is the shared ~/.claude (or the gateway's token). Its cron jobs, Run now and other served tasks keep that login under multiplexing instead of being refused. It counts only in a process started for this profile. Leave off for any other profile, and never set it in a machine-wide managed config.
  claude_code_telemetry:
    type: bool
    default: false
    label: Claude Code telemetry and error reporting
    description: >-
      Let Claude Code send its usage telemetry and error reports. Off by default. The model picker and
      /usage stay complete either way: their zero-inference probes still fetch Claude Code's feature
      flags and plan limits.
  session_mode:
    type: bool
    default: false
    label: Session mode (experimental)
    description: >-
      Keep one Claude Code process alive per conversation instead of starting one for every model
      call, so steps start faster and every request of a conversation comes from the same process. The
      CLAUDE_SUBSCRIPTION_DIRECTSDK_SESSION_MODE environment variable overrides this setting when set.
  session_pool:
    type: int
    default: 8
    label: Session mode pool size
    description: >-
      Most conversations session mode keeps a Claude Code process for at once (about 400 MB each). The
      plugin lowers it to what fits in a quarter of this machine's RAM; below one, every call runs per-call.
  claude_guidance:
    type: bool
    default: true
    label: Claude harness notes
    description: >-
      Add a few notes for Claude to the system prompt of agent steps: a one-line preamble before
      using tools, short updates on longer work, and how to read harness reminders.
  early_opener:
    type: bool
    default: true
    label: Early session opener
    description: >-
      Show the opening text as soon as Claude starts its first tool call in session mode.
  settle_answers:
    type: bool
    default: false
    label: Treat earlier answers as settled
    description: >-
      Add one more harness note asking Claude to treat answers it already gave as settled unless the
      user asks about them (off until measured).
  drop_open_turn_thinking:
    type: bool
    default: false
    label: Replay an open turn without its thinking
    description: >-
      Session mode: when a native is spawned cold in the middle of a turn (after a compaction, say),
      replay that unfinished turn without its thinking blocks. Avoids a second full cache write on the next
      user turn; Claude loses its own earlier reasoning for the rest of that one turn.
  max_concurrent:
    type: int
    default: 4
    label: Claude Code calls at once
    description: >-
      At most this many per-call Claude Code processes (about 250 MB each) run at once in one Hermes process, across its
      profiles, subagents and auxiliary calls. A call past the limit waits for a free one within its own timeout;
      it is not failed or sent to another provider. /usage, the model picker and session-mode processes do not count.
  extra_usage:
    type: string
    default: notify
    choices: [allow, notify, ask, stop]
    label: When the plan limit is reached and extra usage starts
    description: >-
      What to do once Claude Code reports that this account is drawing paid extra usage. allow: carry on.
      notify: carry on and log one warning per limit window. ask: refuse each request until you allow the
      current window (extra_usage_allowed_until). stop: refuse every request until the plan limit resets.
      The request that crosses the limit is already billed; the setting acts on the next one. In ask and stop,
      a request is also refused when Claude Code cannot say whether the account is drawing extra usage.
  extra_usage_allowed_until:
    type: string
    default: ""
    label: Extra usage allowed until (ask mode)
    description: >-
      An ISO 8601 time. In ask mode, requests drawing extra usage are sent until then. The refusal message
      prints the exact command with the current window's reset time.
  extra_usage_reserve_percent:
    type: string
    default: ""
    label: Stop extra usage early at this plan percent (ask and stop modes)
    description: >-
      Optional, for example 97. In ask and stop, a request is refused once the session or weekly plan window
      reaches this percent and extra usage is on, so the request that would first be billed is never sent.
      Empty, invalid, 0 or above 100 means 100 (refuse only once extra usage has started).
  upstream_url:
    type: string
    default: ""
    label: Organization LLM gateway URL
    description: >-
      Send this profile's Claude Messages requests to your organization's gateway instead of
      https://api.anthropic.com. Claude Code's own account calls (/usage, bootstrap, MCP directory) still go to
      api.anthropic.com, through upstream_proxy when set. The Claude login's bearer token goes to this host. https:// only
      (http:// only for a loopback host), no user:password, query or fragment. Empty means Anthropic directly. An invalid value refuses every
      request rather than falling back.
  upstream_proxy:
    type: string
    default: ""
    label: Upstream CONNECT proxy
    description: >-
      http://host:port of an HTTP CONNECT proxy for the upstream hop (TLS still ends at the upstream host) and
      for Claude Code's own calls to api.anthropic.com. Put its user:password in
      CLAUDE_SUBSCRIPTION_DIRECTSDK_PROXY_AUTH in the profile's .env.
  upstream_ca_file:
    type: string
    default: ""
    label: Extra CA bundle for the upstream hop
    description: >-
      A PEM file added to the system roots, for a TLS-inspecting proxy or a gateway with a private CA.
      Certificate and hostname checks stay on. An unreadable file refuses every request.

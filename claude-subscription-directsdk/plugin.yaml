name: claude-subscription-directsdk-experimental
kind: model-provider
version: 0.3.3+session.2
manifest_version: 2
description: Claude Subscription DirectSDK (Experimental), session-mode fork — drive your Claude Pro/Max subscription through the official Claude Code CLI; Hermes owns tools, approvals and compaction
author: Nous Research
license: MIT
homepage: https://github.com/100yenadmin/hermes-official-plugins/tree/eva/session-main/claude-subscription-directsdk
tags: [model-provider, anthropic, claude, subscription, experimental]
requires_hermes: ">=0.21.4"
platforms: []
optional_env:
  - CLAUDE_SUBSCRIPTION_DIRECTSDK_COMMAND
  - CLAUDE_SUBSCRIPTION_DIRECTSDK_CONFIG_DIR
  - CLAUDE_CONFIG_DIR
external_dependencies:
  - name: claude
    check: "claude --version"
    install: "npm install -g @anthropic-ai/claude-code"
config_schema:
  claude_config_dir:
    type: string
    default: ""
    label: Claude login config directory
    description: Select this profile's logged-in Claude config directory, overriding process environment directories.
  claude_code_telemetry:
    type: bool
    default: true
    label: Claude Code telemetry and feature flags
    description: >-
      Let Claude Code send its usage telemetry and fetch feature flags. Feature flags unlock newer
      models in the model picker; turn off to keep Claude Code quiet (the picker may then list fewer
      models).
  session_mode:
    type: bool
    default: false
    label: Session mode (experimental)
    description: >-
      Keep one Claude Code process alive per conversation instead of starting one for every model
      call, so steps start faster and every request of a conversation comes from the same process. The
      CLAUDE_SUBSCRIPTION_DIRECTSDK_SESSION_MODE environment variable overrides this setting when set.
  session_pool:
    type: int
    default: 8
    label: Session mode pool size
    description: >-
      Most conversations session mode keeps a Claude Code process for at once (about 400 MB each). The
      plugin lowers it to what fits in a quarter of this machine's RAM; below one, every call runs per-call.
  progress_updates:
    type: bool
    default: true
    label: Progress updates as messages
    description: >-
      Show the short progress notes Claude writes between tool calls as messages (Claude Code's own
      display). The reasoning panel then shows less of Claude's thinking.
  claude_guidance:
    type: bool
    default: true
    label: Claude harness notes
    description: >-
      Add a few notes for Claude to the system prompt of agent steps: a one-line preamble before the
      first tool call, short updates on longer work, and how to read harness reminders.
  settle_answers:
    type: bool
    default: false
    label: Treat earlier answers as settled
    description: >-
      Add one more harness note asking Claude to treat answers it already gave as settled unless the
      user asks about them (off until measured).

name: Bug report
description: Something in one of the official plugins doesn't work
title: "[plugin] "
labels: [bug]
body:
  - type: dropdown
    id: plugin
    attributes:
      label: Plugin
      options:
        - homeassistant
        - spotify
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Output of `hermes version` and `hermes plugins list`
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from `~/.hermes/logs/`. Remove tokens and personal data.
      render: text
